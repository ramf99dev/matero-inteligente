name: matero_fixed
description: "Matero Inteligente - Sistema de Monitoreo"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.8.3 # Para Supabase
  http: ^1.1.0 # Para APIs del clima
  logger: ^2.6.2 # Para logging
  image_picker: ^1.0.7 # Para seleccionar imagenes
  url_launcher: ^6.2.0 # Para abrir URLs
  flutter_dotenv: ^5.1.0 # Para variables de entorno
  intl: ^0.19.0 # Para formateo de fechas
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
